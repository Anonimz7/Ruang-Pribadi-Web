name: Kontan Archive & Supabase Sync

on:
  schedule:
    # Menggunakan jadwal scraper: Menit ke-19 dan ke-49 setiap jam
    - cron: '19,49 * * * *'
  workflow_dispatch: 

jobs:
  process-data:
    runs-on: ubuntu-latest
    # Menggunakan izin 'write' agar bisa commit hasil scrape
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pytz

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Update: Daily Archive [skip ci]"
          file_pattern: 'data/**'

      - name: Sync data.db to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_to_supabase.py
