<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Midnight Blue</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap");

        :root {
            --bg: #0a122a;
            --bg-2: #0f1b3d;
            --card: rgba(13, 25, 55, 0.9);
            --ink: #e6edf7;
            --muted: #9fb0c6;
            --accent: #4cc9f0;
            --accent-2: #5eead4;
            --glow: rgba(76, 201, 240, 0.35);
            --ok: #5eead4;
            --warn: #fbbf24;
            --bad: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(700px 400px at 15% 20%, rgba(76, 201, 240, 0.2), transparent 60%),
                radial-gradient(700px 400px at 90% 80%, rgba(94, 234, 212, 0.12), transparent 55%),
                linear-gradient(160deg, var(--bg), var(--bg-2));
            font-family: "Archivo", "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            padding: 28px;
        }

        .shell {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 30px 60px rgba(4, 12, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        p.lead {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        .result {
            margin: 18px 0 22px;
            padding: 22px;
            border-radius: 16px;
            background: rgba(7, 17, 40, 0.7);
            border: 1px solid rgba(76, 201, 240, 0.2);
            display: grid;
            gap: 8px;
            justify-items: center;
        }

        .score {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 3.2rem;
            letter-spacing: -0.04em;
        }

        .tier {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .tip {
            color: var(--muted);
            line-height: 1.5;
        }

        .meter {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f87171, #fbbf24, #5eead4);
            transition: width 0.6s ease;
        }

        .roll-button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #06142f;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 16px 28px var(--glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .roll-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 34px var(--glow);
        }

        .history {
            margin-top: 20px;
            display: grid;
            gap: 10px;
            text-align: left;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(9, 18, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            color: var(--muted);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 8px;
        }

        .badge.ok { color: var(--ok); background: rgba(94, 234, 212, 0.15); }
        .badge.warn { color: var(--warn); background: rgba(251, 191, 36, 0.15); }
        .badge.bad { color: var(--bad); background: rgba(248, 113, 113, 0.15); }

        @media (max-width: 640px) {
            h1 { font-size: 1.9rem; }
            .score { font-size: 2.6rem; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <h1>Gacha Midnight Blue</h1>
        <p class="lead">Murni acak. Klik untuk mengundi keberuntunganmu sekarang.</p>

        <section class="result">
            <div class="score" id="score">--</div>
            <div class="tier" id="tier">Belum ada hasil</div>
            <div class="tip" id="tip">Tekan tombol gacha untuk mulai.</div>
            <div class="meter"><div class="meter-fill" id="meter"></div></div>
        </section>

        <button class="roll-button" id="roll">Gacha Sekarang</button>

        <div class="history" id="history"></div>
    </main>

    <script>
        const rollButton = document.getElementById("roll");
        const scoreEl = document.getElementById("score");
        const tierEl = document.getElementById("tier");
        const tipEl = document.getElementById("tip");
        const meterEl = document.getElementById("meter");
        const historyEl = document.getElementById("history");

        const tiers = [
            { min: 90, label: "Sangat Beruntung", color: "var(--ok)", tip: "Kesempatan bagus. Ambil langkah yakin." },
            { min: 70, label: "Beruntung", color: "var(--ok)", tip: "Momentum bagus. Fokus eksekusi." },
            { min: 50, label: "Stabil", color: "var(--accent-2)", tip: "Aman dan terkendali. Lanjutkan rencana." },
            { min: 30, label: "Hati-hati", color: "var(--warn)", tip: "Cek ulang sebelum ambil keputusan." },
            { min: 11, label: "Rendah", color: "var(--bad)", tip: "Kurangi risiko besar." },
            { min: 0, label: "Kurang Beruntung", color: "var(--bad)", tip: "Fokus pada hal yang bisa dikontrol." }
        ];

        const state = {
            history: []
        };

        function pickTier(score) {
            return tiers.find(tier => score >= tier.min) || tiers[tiers.length - 1];
        }

        function animateScore(target) {
            let current = 0;
            const steps = 20;
            let count = 0;
            const interval = setInterval(() => {
                count += 1;
                current = Math.min(target, current + target / steps);
                scoreEl.textContent = Math.round(current);
                meterEl.style.width = `${Math.round(current)}%`;
                if (count >= steps) {
                    clearInterval(interval);
                    scoreEl.textContent = target;
                    meterEl.style.width = `${target}%`;
                }
            }, 35);
        }

        function renderHistory() {
            historyEl.innerHTML = "";
            state.history.slice(0, 5).forEach(entry => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = `${entry.time} — ${entry.score} <span class="badge ${entry.badge}">${entry.tier}</span>`;
                historyEl.appendChild(div);
            });
        }

        function rollGacha() {
            rollButton.disabled = true;
            const roll = Math.random();
            let score = 50;

            if (roll < 0.01) {
                score = Math.floor(Math.random() * 11);
            } else if (roll < 0.02) {
                score = 90 + Math.floor(Math.random() * 11);
            } else {
                const min = 11;
                const max = 89;
                const peak = 50;
                const u = Math.random();
                const c = (peak - min) / (max - min);
                if (u < c) {
                    score = min + Math.sqrt(u * (max - min) * (peak - min));
                } else {
                    score = max - Math.sqrt((1 - u) * (max - min) * (max - peak));
                }
                score = Math.round(score);
            }
            const tier = pickTier(score);

            animateScore(score);
            tierEl.textContent = tier.label;
            tierEl.style.color = tier.color;
            tipEl.textContent = tier.tip;

            const badge = score >= 70 ? "ok" : score >= 30 ? "warn" : "bad";
            const time = new Date().toTimeString().slice(0, 5);
            state.history.unshift({
                time,
                score,
                tier: tier.label,
                badge
            });
            state.history = state.history.slice(0, 5);
            renderHistory();

            setTimeout(() => {
                rollButton.disabled = false;
            }, 500);
        }

        rollButton.addEventListener("click", rollGacha);
    </script>
</body>
</html>
