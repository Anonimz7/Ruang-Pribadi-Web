<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read • Analyst Hub Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    :root {
      --bg: #0b1120;
      --bg-elevated: rgba(16, 24, 40, 0.85);
      --card: rgba(15, 23, 42, 0.9);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.18);
      --accent: #38bdf8;
      --accent-strong: #6366f1;
      --accent-warm: #f97316;
      --mermaid-bg: #111827;
      --mermaid-line: #94a3b8;
      --mermaid-text: #e2e8f0;
      --mermaid-node: #6366f1;
      --shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
    }

    .light-mode {
      --bg: #f8fafc;
      --bg-elevated: rgba(255, 255, 255, 0.9);
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(148, 163, 184, 0.35);
      --accent: #2563eb;
      --accent-strong: #7c3aed;
      --accent-warm: #f97316;
      --mermaid-bg: #ffffff;
      --mermaid-line: #475569;
      --mermaid-text: #1e293b;
      --mermaid-node: #2563eb;
      --shadow: 0 30px 70px rgba(15, 23, 42, 0.1);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: 0.3s;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 45%),
        radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.2), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.18), transparent 35%);
      z-index: -2;
      transition: 0.3s;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.85), rgba(2, 6, 23, 0.9));
      z-index: -3;
      transition: 0.3s;
    }

    .light-mode::after {
      background: linear-gradient(180deg, rgba(241, 245, 249, 0.9), rgba(226, 232, 240, 0.9));
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .markdown-body {
      font-size: 0.9375rem;
      line-height: 1.6;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .markdown-body p {
      margin-bottom: 1em;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 1.5em;
      margin-bottom: 1em;
      list-style-position: outside;
    }

    .markdown-body ul {
      list-style-type: disc;
    }

    .markdown-body ol {
      list-style-type: decimal;
    }

    .markdown-body li {
      margin: 0.25rem 0;
    }

    .markdown-body code {
      background: rgba(148, 163, 184, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .markdown-body pre {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
    }

    .markdown-body input[type="checkbox"] {
      margin-right: 0.5rem;
      accent-color: #3b82f6;
      transform: translateY(1px);
    }

    .markdown-body blockquote {
      border-left: 4px solid rgba(56, 189, 248, 0.5);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.4);
      border-radius: 0.5rem;
    }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      margin: 1.5rem 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.875rem;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    .markdown-body thead {
      background: rgba(30, 41, 59, 0.6);
    }

    .mermaid-container {
      background: var(--mermaid-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    .mermaid-pan-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    .mermaid-pan-wrapper:active {
      cursor: grabbing;
    }

    .mermaid-pan-layer {
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }

    .mermaid-container svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    .mermaid-toolbar {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      gap: 0.4rem;
      z-index: 2;
    }

    .mermaid-toolbar button {
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      line-height: 1;
      transition: background 0.2s;
    }

    .mermaid-toolbar button:hover {
      background: rgba(30, 41, 59, 0.9);
    }

    .light-mode .mermaid-toolbar button {
      background: rgba(255, 255, 255, 0.9);
      color: #1e293b;
    }

    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>

<body class="p-4 md:p-6">
  <div class="fixed top-4 left-4 z-50 flex items-center gap-2">
    <a href="./index.html" 
       class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg flex items-center gap-2 transition-all">

  <button type="button" onclick="toggleTheme()"

    <span>Print</span>
  </button>

  <div class="max-w-4xl mx-auto mt-16">
    <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800/60 pb-6 gap-4">
      <div>
        <p class="text-[11px] text-slate-400 uppercase tracking-[0.4em]">Reading Room</p>
        <h1 class="text-3xl font-extrabold tracking-tight">
          <span class="text-blue-400 italic">ANALYST</span>

          <span class="text-slate-500 text-lg ml-2">• READ MODE</span>
        </h1>

  <script>
    // ==================== CONFIGURATION ====================
    const API_BASE = "/api";
    const TOKEN_STORAGE = "ahp_token_v1";
    const THEME_STORAGE = "ahp_theme_v1";

    // ==================== STATE VARIABLES ====================
    let currentArticle = null;

    marked.setOptions({ gfm: true, breaks: true });

    const MARKDOWN_SANITIZE_CONFIG = {
      ADD_TAGS: ['input'],
      ADD_ATTR: ['type', 'checked', 'disabled', 'data-task-index', 'class']
    };

    function normalizeMarkdown(text) {
      return String(text || '')
        .replace(/\\r\\n/g, '\n')
        .replace(/\\n/g, '\n')
        .replace(/\\r/g, '\n')
        .replace(/\\t/g, '\t');
    }

    // ==================== THEME MANAGEMENT ====================
    function toggleTheme() {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      document.getElementById("theme-icon").innerText = isLight ? "☀️" : "🌙";
      localStorage.setItem(THEME_STORAGE, isLight ? 'light' : 'dark');
      if (currentArticle) renderMermaid();
    }

    function applySavedTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE) || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add("light-mode");
      } else {
        document.body.classList.remove("light-mode");
      }
      document.getElementById("theme-icon").innerText =
        document.body.classList.contains("light-mode") ? "☀️" : "🌙";
    }

    // ==================== AUTH TOKEN ====================
    function getToken() {
      return localStorage.getItem(TOKEN_STORAGE) || "";
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();
      const headers = options.headers ? { ...options.headers } : {};
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      if (options.body && !options.isForm) {
        headers["Content-Type"] = "application/json";
      }

      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers,
        body: options.body && !options.isForm ? JSON.stringify(options.body) : options.body
      });

      return response;
    }

    // ==================== MERMAID FUNCTIONS ====================
    async function renderMermaid() {
      const descriptionEl = document.getElementById('article-description');
      if (!descriptionEl) return;

      const mermaidBlocks = descriptionEl.querySelectorAll('pre code.language-mermaid');
      if (mermaidBlocks.length === 0) return;

      const isDark = !document.body.classList.contains('light-mode');
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'neutral',
        securityLevel: 'strict',
        flowchart: { useMaxWidth: false, htmlLabels: false, curve: 'basis' },
        themeVariables: {
          background: isDark ? '#1e293b' : '#ffffff',
          primaryColor: isDark ? '#1d4ed8' : '#2563eb',
          primaryTextColor: isDark ? '#e2e8f0' : '#1e293b',
          primaryBorderColor: isDark ? '#334155' : '#cbd5f5',
          lineColor: isDark ? '#94a3b8' : '#475569',
          textColor: isDark ? '#e2e8f0' : '#1e293b',
          nodeBorder: isDark ? '#334155' : '#e2e8f0',
          clusterBkg: isDark ? '#0f172a' : '#f8fafc',
          clusterBorder: isDark ? '#334155' : '#e2e8f0'
        }
      });

      for (const block of mermaidBlocks) {
        try {
          const mermaidContent = block.textContent.trim();
          if (!mermaidContent) continue;

          const container = document.createElement('div');
          container.className = 'mermaid-container';
          const mermaidDiv = document.createElement('div');
          mermaidDiv.className = 'mermaid';
          mermaidDiv.textContent = mermaidContent;

          container.appendChild(mermaidDiv);
          block.parentElement.replaceWith(container);
        } catch (err) {
          console.error('Mermaid error:', err);
        }
      }

      try {
        await mermaid.run({ nodes: document.querySelectorAll('.mermaid-container .mermaid') });
        descriptionEl.querySelectorAll('.mermaid-container').forEach(setupMermaidPanZoom);
      } catch (err) {
        console.error('Mermaid render error:', err);
      }
    }

    function renderMathForElement(element) {
      if (!element || typeof renderMathInElement !== 'function') {
        return;
      }
      try {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false
        });
      } catch (err) {
        console.error('KaTeX render error:', err);
      }
    }

    function setupMermaidPanZoom(container) {
      if (!container || container.dataset.panzoomReady) return;
      const mermaidDiv = container.querySelector('.mermaid');
      if (!mermaidDiv) return;

      const panWrapper = document.createElement('div');
      panWrapper.className = 'mermaid-pan-wrapper';

      const panLayer = document.createElement('div');
      panLayer.className = 'mermaid-pan-layer';

      const toolbar = document.createElement('div');
      toolbar.className = 'mermaid-toolbar';
      toolbar.innerHTML = `
        <button type="button" data-action="zoom-in">＋</button>
        <button type="button" data-action="zoom-out">－</button>
        <button type="button" data-action="reset">⟲</button>
      `;

      container.appendChild(toolbar);
      panWrapper.appendChild(panLayer);
      panLayer.appendChild(mermaidDiv);
      container.appendChild(panWrapper);

      const state = { scale: 1, x: 0, y: 0, dragging: false, startX: 0, startY: 0 };

      const applyTransform = () => {
        panLayer.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      };

      const clampScale = (value) => Math.min(3, Math.max(0.5, value));

      toolbar.addEventListener('click', (event) => {
        const action = event.target?.dataset?.action;
        if (!action) return;
        if (action === 'zoom-in') {
          state.scale = clampScale(state.scale + 0.2);
        } else if (action === 'zoom-out') {
          state.scale = clampScale(state.scale - 0.2);
        } else if (action === 'reset') {
          state.scale = 1;
          state.x = 0;
          state.y = 0;
        }
        applyTransform();
      });

      panWrapper.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = event.deltaY > 0 ? -0.1 : 0.1;
        state.scale = clampScale(state.scale + delta);
        applyTransform();
      }, { passive: false });

      panWrapper.addEventListener('pointerdown', (event) => {
        state.dragging = true;
        state.startX = event.clientX - state.x;
        state.startY = event.clientY - state.y;
        panWrapper.setPointerCapture(event.pointerId);
      });

      panWrapper.addEventListener('pointermove', (event) => {
        if (!state.dragging) return;
        state.x = event.clientX - state.startX;
        state.y = event.clientY - state.startY;
        applyTransform();
      });

      panWrapper.addEventListener('pointerup', (event) => {
        state.dragging = false;
        panWrapper.releasePointerCapture(event.pointerId);
      });

      panWrapper.addEventListener('pointerleave', () => {
        state.dragging = false;
      });

      applyTransform();
      container.dataset.panzoomReady = 'true';
    }

    // ==================== ARTICLE LOADING ====================
    function getArticleIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('id');
    }

    async function loadArticle() {
      const articleId = getArticleIdFromURL();
      if (!articleId) {
        showError("No article ID provided in URL");
        return;
      }

      showLoading();

      try {
        const response = await apiRequest(`/articles/${articleId}`);
        if (response.status === 401) {
          showLoginRequired();
          return;
        }

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || "Failed to load article");
        }

        const data = await response.json();
        currentArticle = data.item;
        await renderArticle(data.item);

      } catch (error) {
        console.error("Error loading article:", error);
        showError(error.message || "Failed to load article");
      }
    }

    function showLoading() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('article-content').classList.add('hidden');
      document.getElementById('login-missing-prompt').classList.add('hidden');
    }

    function showError(message) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-message').textContent = message;
      document.getElementById('article-content').classList.add('hidden');
    }

    function showContent() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('article-content').classList.remove('hidden');
    }

    function showLoginRequired() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('article-content').classList.remove('hidden');
      document.getElementById('login-missing-prompt').classList.remove('hidden');
      document.getElementById('article-description').innerHTML = `
        <div class="text-center py-12 text-slate-400 italic">
          Please login first to view this content.
        </div>`;
    }

    // ==================== RENDERING ====================
    async function renderArticle(article) {
      document.getElementById('article-title').textContent = article.title || 'Untitled';
      document.getElementById('article-type').textContent = article.type || 'Unknown';
      document.getElementById('article-category').textContent = article.category || 'Uncategorized';
      document.getElementById('article-status').textContent = article.status || 'No Status';
      document.getElementById('article-date').textContent = article.date || 'Unknown';
      document.getElementById('article-id').textContent = article.id;
      const pinnedBadge = document.getElementById('article-pinned');
      if (pinnedBadge) {
        pinnedBadge.classList.toggle('hidden', !article.pinned);
      }
      const editLink = document.getElementById('edit-link');
      if (editLink) {
        const tabParam = article.type === 'journal' ? 'journal' : 'observation';
        editLink.href = `./index.html?edit=${encodeURIComponent(article.id)}&tab=${encodeURIComponent(tabParam)}`;
      }

      if (article.url) {
        document.getElementById('article-url-container').classList.remove('hidden');
        document.getElementById('article-url').href = article.url;
        try {
          const urlObj = new URL(article.url);
          document.getElementById('article-url-text').textContent = urlObj.hostname;
        } catch {
          document.getElementById('article-url-text').textContent = article.url.substring(0, 50);
        }
      } else {
        document.getElementById('article-url-container').classList.add('hidden');
      }

      const attachmentSection = document.getElementById('article-attachment');
      const attachmentList = document.getElementById('article-attachment-list');
      attachmentList.innerHTML = '';
      if (article.attachments && article.attachments.length) {
        attachmentSection.classList.remove('hidden');
        article.attachments.forEach(file => {
          const link = document.createElement('a');
          link.href = file.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.className = 'inline-flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300 font-medium';
          link.textContent = `📎 ${file.original_name}`;
          attachmentList.appendChild(link);
        });
      } else {
        attachmentSection.classList.add('hidden');
      }

      const tagsContainer = document.getElementById('article-tags-container');
      tagsContainer.innerHTML = '';
      if (article.tags) {
        article.tags.split(',').forEach(tag => {
          if (tag.trim()) {
            const tagSpan = document.createElement('span');
            tagSpan.className = 'px-2 py-1 text-xs text-indigo-400 bg-indigo-500/10 rounded border border-indigo-500/20 italic';
            tagSpan.textContent = `#${tag.trim()}`;
            tagsContainer.appendChild(tagSpan);
          }
        });
      }

      renderDescription(article.description || "");
      showContent();
    }

    function renderDescription(text) {
      const descriptionEl = document.getElementById('article-description');
      
      const normalizedText = normalizeMarkdown(text);

      if (!normalizedText || normalizedText.trim() === "") {
        descriptionEl.innerHTML = `
          <div class="text-center py-12 text-slate-400 italic">
            No content available for this article.
          </div>`;
        return;
      }
      
      const processedText = normalizedText.replace(/\[\[(\d+)\]\]/g, (match, id) => {
        return `<a href="./index.html?search=${id}" 
                   class="text-blue-400 hover:text-blue-300 underline font-bold" 
                   title="Search for reference #${id}">
                  [[Ref: #${id}]]
                </a>`;
      });

      try {
        const rawHtml = marked.parse(processedText);
        const cleanHtml = DOMPurify.sanitize(rawHtml, MARKDOWN_SANITIZE_CONFIG);
        
        descriptionEl.innerHTML = cleanHtml;
        setupTaskListInteractions(normalizedText);
        renderMathForElement(descriptionEl);

        setTimeout(() => renderMermaid(), 100);
      } catch (error) {
        console.error("Markdown parsing error:", error);
        descriptionEl.innerHTML = `
          <div class="text-red-400">
            Error parsing content. Showing raw text:
          </div>
          <pre class="mt-4 p-4 bg-slate-800 rounded overflow-auto">${normalizedText}</pre>`;
      }
    }

    function setupTaskListInteractions(text) {
      const descriptionEl = document.getElementById('article-description');
      if (!descriptionEl || !text) return;

      const checkboxes = descriptionEl.querySelectorAll('input[type="checkbox"]');
      if (!checkboxes.length) return;

      let taskIndex = 0;
      checkboxes.forEach(checkbox => {
        checkbox.dataset.taskIndex = String(taskIndex);
        checkbox.disabled = false;
        checkbox.addEventListener('change', handleTaskToggle);
        taskIndex += 1;
      });
    }

    function updateTaskInDescription(description, taskIndex, isChecked) {
      let currentIndex = 0;
      const checkboxMarker = isChecked ? 'x' : ' ';
      return description.replace(/^(\s*[-*+]\s+\[)([ xX])(\]\s+)/gm, (match, prefix, marker, suffix) => {
        if (currentIndex === taskIndex) {
          currentIndex += 1;
          return `${prefix}${checkboxMarker}${suffix}`;
        }
        currentIndex += 1;
        return match;
      });
    }

    async function handleTaskToggle(event) {
      const checkbox = event.target;
      if (!currentArticle || !checkbox) return;

      const taskIndex = Number(checkbox.dataset.taskIndex);
      if (Number.isNaN(taskIndex)) return;

      const nextChecked = checkbox.checked;
      const previousChecked = !nextChecked;
      const updatedDescription = updateTaskInDescription(currentArticle.description || "", taskIndex, nextChecked);

      if (updatedDescription === currentArticle.description) {
        checkbox.checked = previousChecked;
        return;
      }

      checkbox.disabled = true;

      try {
        const payload = {
          type: currentArticle.type,
          title: currentArticle.title,
          date: currentArticle.date,
          url: currentArticle.url,
          status: currentArticle.status,
          category: currentArticle.category,
          tags: currentArticle.tags,
          description: updatedDescription,
          attachment_ids: (currentArticle.attachments || []).map(file => file.id)
        };

        const response = await apiRequest(`/articles/${currentArticle.id}`, {
          method: 'PUT',
          body: payload
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || 'Failed to update task list.');
        }

        currentArticle.description = updatedDescription;
      } catch (error) {
        console.error("Task update error:", error);
        checkbox.checked = previousChecked;
        alert(error.message || "Failed to update task list.");
      } finally {
        checkbox.disabled = false;
      }
    }

    // ==================== INITIALIZATION ====================
    function initialize() {
      applySavedTheme();
      
      loadArticle();
      
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
          e.preventDefault();
          window.print();
        }
        if (e.key === 'Escape') {
          window.history.back();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
